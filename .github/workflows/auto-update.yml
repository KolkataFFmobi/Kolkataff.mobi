# auto-update — polls the public result sources, ingests 2-source-confirmed
# results, rebuilds, and commits. Runs in GitHub's cloud, so results keep
# flowing while every human machine is asleep.
#
# HOW DEPLOYMENT HAPPENS NOW (changed 2026-07-28):
# Cloudflare is connected directly to this repository and builds it on every
# push to `main` (build: `npm run build`, deploy: `wrangler deploy --assets
# dist`). So this workflow does NOT deploy anything itself — it just commits,
# and the resulting push is what makes Cloudflare build and go live.
#
# That means NO Cloudflare credentials are needed here. The only token used is
# GitHub's own built-in GITHUB_TOKEN (via `permissions: contents: write`),
# which never leaves GitHub and needs no manual setup.
#
# OPTIONAL: set a `CF_DEPLOY_HOOK` repository secret (Cloudflare -> Worker ->
# Settings -> Build -> Deploy Hooks) and this workflow will also ping it after
# pushing. That is belt and braces: the push webhook should already trigger a
# build, and the hook guarantees one even if the webhook is ever missed. If the
# secret is absent the step is simply skipped.
#
# NOTE ON SCHEDULE_VERIFIED: it no longer gates deployment. In the previous
# architecture this workflow ran the deploy, so it could refuse. Now Cloudflare
# deploys ANY push to `main`, so nothing here can stop a deploy — the flag is
# advisory only. Treat verifying the bazi times as a real outstanding task, not
# something this guard still protects you from.

name: auto-update

on:
  schedule:
    # Every 5 min through the IST result day (09:30-21:29 IST = 04:00-15:59 UTC).
    # 5 is GitHub's minimum granularity, so this is the tightest polling
    # available; it cuts worst-case lag from ~12 min to ~5. Every source is
    # polled on every run — alternating between sources would be WORSE, since
    # each site would then only be checked every other cycle. Free: public
    # repositories get unmetered Actions minutes.
    - cron: '*/5 4-15 * * *'
    # 00:05 IST daily freeze pass (18:35 UTC the previous UTC day).
    - cron: '35 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install: the project is Node stdlib only, by design.
      # auto-update.js exits 2 on a source CONFLICT — that must surface as a
      # failed run (so GitHub emails you) WITHOUT losing results it did ingest,
      # so the exit code is captured and re-raised at the very end.
      - name: Fetch, confirm, ingest, build
        id: ingest
        run: |
          set +e
          node scripts/auto-update.js
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      # Hard guard, still meaningful here: never commit dummy seed data.
      - name: Refuse dummy data
        run: |
          if [ -f dist/.dummy-data ]; then
            echo "::error::dist/.dummy-data present — data/results.json still carries the DUMMY marker. Refusing to commit."
            exit 1
          fi

      - name: Commit and push results
        id: commit
        run: |
          if git diff --quiet data/results.json; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
            echo "No data changes this run."
          else
            git config user.name "kff-auto-update"
            git config user.email "bot@kolkataff.mobi"
            git add data/results.json
            git commit -m "auto: results update $(date -u +%FT%TZ)"
            git push
            echo "changed=1" >> "$GITHUB_OUTPUT"
            echo "Pushed — Cloudflare will build and deploy from this commit."
          fi

      # Optional explicit build trigger. Skipped automatically when the secret
      # is not configured, so the workflow works either way.
      - name: Ping Cloudflare deploy hook (optional)
        if: steps.commit.outputs.changed == '1' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          echo "deploy hook responded HTTP $code"
          if [ "$code" -ge 400 ]; then
            echo "::warning::Deploy hook returned $code — the push webhook should still have triggered a build; check the Cloudflare build log."
          fi

      # Re-raise a CONFLICT (exit 2) so the run goes red and GitHub notifies
      # you. Anything the bot could safely confirm has already been committed
      # above; this only flags the disputed value for human review.
      - name: Surface source conflicts
        if: steps.ingest.outputs.code == '2'
        run: |
          echo "::error::auto-update reported a source CONFLICT (exit 2). A published result disagrees with a source and was deliberately NOT overwritten. Review the log above and resolve manually."
          exit 1
